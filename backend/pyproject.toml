[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "cloud-crew-ai-backend"
version = "0.1.0"
description = "Cloud Crew AI backend — multiagent AWS architecture advisor"
requires-python = ">=3.12"
dependencies = [
    "pydantic>=2",
    "langgraph>=0.3",
    "langchain-core>=0.3",
    "fastapi>=0.115",
    "uvicorn[standard]>=0.32",
]

[project.optional-dependencies.llm-anthropic]
dependencies = ["anthropic>=0.40"]

[project.optional-dependencies.llm-openai]
dependencies = ["openai>=1.0"]

[project.optional-dependencies.llm-bedrock]
dependencies = ["boto3>=1.35"]

[project.optional-dependencies]
dev = [
    "pytest>=8",
    "pytest-cov>=5",
    "pytest-asyncio>=0.23",
    "httpx>=0.27",
]

[tool.hatch.build.targets.wheel]
packages = ["src"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
addopts = "--cov=src --cov-report=term-missing --cov-fail-under=80"

[tool.coverage.run]
source = ["src"]
omit = ["src/shared/config.py"]

[tool.coverage.report]
exclude_lines = [
    "pragma: no cover",
    "if TYPE_CHECKING:",
    "\\.\\.\\.",
]
